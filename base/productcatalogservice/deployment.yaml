

apiVersion: apps/v1
kind: Deployment

metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice

spec:
  replicas: 2

  selector:
    matchLabels:
      app: productcatalogservice

  template:
    metadata:
      labels:
        app: productcatalogservice

    spec:
      containers:
        - name: productcatalogservice
          image: nishanthhj02/productcatalogservice:e9fe62d

          ports:
            - containerPort: 3550
