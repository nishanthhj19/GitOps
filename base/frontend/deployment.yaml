
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: nishanthhj02/frontend:f007c42af448b3da9dc8d6fe9dc54d09376566ef
          ports:
            - containerPort: 8080
