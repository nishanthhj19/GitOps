
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: nishanthhj02/frontend:4318ada2f238d8560cd6c308c531bc88a57e3279
          ports:
            - containerPort: 8080
